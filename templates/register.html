<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja - System Rekomendacji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #1f2937; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-white mb-6 text-center">Załóż konto</h1>

        <div id="msg-box" class="p-3 mb-4 rounded-lg text-sm text-center hidden"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-1">Nazwa Użytkownika</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-1">Hasło</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
            </div>

            <button type="submit" id="submit-btn"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                Zarejestruj się
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Masz już konto? 
                <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium">Zaloguj się</a>
            </p>
        </div>
    </div>

<script>
    async function handleRegister(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgBox = document.getElementById('msg-box');
        const btn = document.getElementById('submit-btn');

        msgBox.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = "Rejestracja...";

        try {
            const response = await fetch("http://127.0.0.1:8000/auth/register", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Błąd rejestracji");
            }

            // SUKCES
            msgBox.textContent = "Konto utworzone! Przekierowanie do logowania...";
            msgBox.className = "p-3 mb-4 rounded-lg text-sm text-center bg-green-900 text-green-300";
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = "/login";
            }, 2000);

        } catch (error) {
            msgBox.textContent = error.message;
            msgBox.className = "p-3 mb-4 rounded-lg text-sm text-center bg-red-900 text-red-300";
            msgBox.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = "Zarejestruj się";
        }
    }
</script>
</body>
</html>
