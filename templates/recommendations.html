<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Ciebie - Personalizowane Rekomendacje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1f2937; min-height: 100vh; }
        .glass-card {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }
        .explanation-box {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #3b82f6;
        }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8">

    {% include "navbar.html" %}

    <div class="max-w-7xl mx-auto mb-8 mt-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-blue-600/10 rounded-full blur-3xl"></div>

            <h1 class="text-3xl font-bold text-white mb-2 relative z-10">🎬 Dla Ciebie</h1>
            <p id="modelMessage" class="text-blue-400 font-medium relative z-10 flex items-center gap-2">
                <span class="inline-block w-2 h-2 bg-blue-500 rounded-full animate-ping"></span>
                Inicjalizacja inteligentnego systemu ANFIS...
            </p>
        </div>
    </div>

    <div id="recommendationsGrid" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div id="loading" class="col-span-full text-center py-20">
            <div class="inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-400 font-medium">Model ANFIS analizuje Twoje preferencje...</p>
        </div>
    </div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    // Ulepszona funkcja dekodowania JWT
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            console.error("Błąd dekodowania tokena:", e);
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initRecommendations();
    });

    async function initRecommendations() {
        const grid = document.getElementById('recommendationsGrid');

        // 1. Pobierz token z Local Storage
        const token = localStorage.getItem('accessToken');

        if (!token) {
            grid.innerHTML = `<div class="col-span-full text-center p-10 bg-yellow-900/20 text-yellow-400 rounded-xl border border-yellow-500">
                Nie znaleziono sesji. Zaloguj się ponownie.
            </div>`;
            return;
        }

        // 2. Wyciągnij ID sprawdzając różne możliwe klucze
        const payload = parseJwt(token);
        console.log("Token Payload:", payload); // Sprawdź to w F12!

        // Sprawdzamy sub, id oraz user_id
        const userId = payload?.sub || payload?.id || payload?.user_id;

        if (!userId) {
            grid.innerHTML = `<div class="col-span-full text-center p-10 bg-red-900/20 text-red-400 rounded-xl border border-red-500">
                Błąd sesji: Nie można odczytać ID użytkownika z tokena.
            </div>`;
            return;
        }

        console.log('🚀 Ładuję rekomendacje dla ID:', userId);
        await loadRecommendations(userId);
    }

    async function loadRecommendations(userId) {
        const grid = document.getElementById('recommendationsGrid');
        const messageEl = document.getElementById('modelMessage');

        try {
            // Zapytanie do backendu o rekomendacje
            const res = await fetch(`${API_URL}/recommendations/?user_id=${userId}&limit=12&exclude_rated=true`);

            if(!res.ok) {
                const errorData = await res.json().catch(() => ({ detail: "Błąd serwera (Model ANFIS)" }));
                throw new Error(errorData.detail || `Błąd ${res.status}`);
            }

            const data = await res.json();
            messageEl.innerHTML = `<span class="inline-block w-2 h-2 bg-green-500 rounded-full"></span> ${data.message}`;
            grid.innerHTML = "";

            if(!data.recommendations || data.recommendations.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Brak rekomendacji. Oceń więcej filmów lub wypełnij preferencje.</div>`;
                return;
            }

            // Renderowanie kart (bez zmian)
            data.recommendations.forEach(m => {
                const confClass = m.confidence === 'bardzo wysoka' ? 'text-green-400' : 'text-blue-400';
                grid.innerHTML += `
                    <div class="glass-card rounded-xl overflow-hidden flex flex-col group hover:border-blue-500/50 transition duration-300">
                        <div class="relative aspect-[16/9] overflow-hidden cursor-pointer" onclick="window.location.href='/movie?id=${m.movie_id}'">
                            <img src="${m.poster_url || 'https://via.placeholder.com/400x225'}" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 left-3"><span class="text-yellow-400 font-bold">★ ${m.predicted_rating}</span></div>
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="font-bold text-white mb-2">${m.title}</h3>
                            <p class="text-xs text-gray-400 italic mb-4 flex-grow">${m.explanation}</p>
                            <div class="flex justify-between items-center pt-4 border-t border-gray-700">
                                <span class="text-[10px] font-bold ${confClass} uppercase">${m.confidence}</span>
                                <button class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded">SZCZEGÓŁY</button>
                            </div>
                        </div>
                    </div>`;
            });

        } catch(e) {
            console.error('❌ Błąd:', e);
            grid.innerHTML = `
                <div class="col-span-full text-center py-10 text-red-400 bg-red-900/10 rounded-xl border border-red-900/50">
                    <p class="font-bold">Wystąpił błąd podczas generowania rekomendacji</p>
                    <p class="text-sm text-gray-400">${e.message}</p>
                    <p class="text-xs text-gray-500 mt-2 italic">Podpowiedź: Upewnij się, że uzupełniłeś preferencje w swoim profilu.</p>
                </div>`;
        }
    }
</script>
</body>
</html>
