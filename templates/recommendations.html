<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Ciebie - Personalizowane Rekomendacje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1f2937; min-height: 100vh; }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8">

    {% include "navbar.html" %}

    <div class="max-w-7xl mx-auto mb-8 mt-4">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-white mb-2">🎬 Dla Ciebie</h1>
                    <p id="modelMessage" class="text-blue-400 font-medium flex items-center gap-2">
                        <span class="inline-block w-2 h-2 bg-blue-500 rounded-full animate-ping"></span>
                        Inicjalizacja inteligentnego systemu ANFIS...
                    </p>
                </div>

                <button id="refreshBtn"
                        onclick="refreshRecommendations()"
                        class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-lg transition flex items-center gap-2 whitespace-nowrap self-start md:self-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Odśwież rekomendacje
                </button>
            </div>
        </div>
    </div>

    <div id="recommendationsGrid" class="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        <div id="loading" class="col-span-full text-center py-20">
            <div class="inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-400 font-medium">Model ANFIS analizuje Twoje preferencje...</p>
        </div>
    </div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    const RECOMMENDATIONS_LIMIT = 10;

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            console.error("Błąd dekodowania tokena:", e);
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('accessToken');
        const userData = localStorage.getItem('user');
        const onboardingCompleted = localStorage.getItem('onboarding_completed');

        if (!token) {
            window.location.href = '/login?next=/my-recommendations';
            return;
        }

        if (userData) {
            try {
                const user = JSON.parse(userData);
                if (user.role === 'admin') {
                    window.location.href = '/admin-panel';
                    return;
                }
            } catch (e) {}
        }

        if (onboardingCompleted !== 'true') {
            window.location.href = '/onboarding';
            return;
        }

        initRecommendations();
    });

    async function refreshRecommendations() {
        const token = localStorage.getItem('accessToken');
        const payload = parseJwt(token);
        const userId = payload?.sub || payload?.id || payload?.user_id;
        const cacheKey = `recommendations_${userId}`;
        localStorage.removeItem(cacheKey);
        localStorage.removeItem(`${cacheKey}_time`);
        location.reload();
    }

    async function initRecommendations() {
        const grid = document.getElementById('recommendationsGrid');
        const token = localStorage.getItem('accessToken');
        const payload = parseJwt(token);
        const userId = payload?.sub || payload?.id || payload?.user_id;
        await loadRecommendations(userId);
    }

    async function loadRecommendations(userId) {
        const grid = document.getElementById('recommendationsGrid');
        const messageEl = document.getElementById('modelMessage');
        try {
            const res = await fetch(`${API_URL}/recommendations/?user_id=${userId}&limit=${RECOMMENDATIONS_LIMIT}&exclude_rated=true`);
            const data = await res.json();
            messageEl.innerHTML = `<span class="inline-block w-2 h-2 bg-green-500 rounded-full"></span> ${data.message}`;
            renderRecommendations(data, grid);
        } catch(e) {
            grid.innerHTML = `<p class="col-span-full text-center text-red-500">Błąd: ${e.message}</p>`;
        }
    }

    function renderRecommendations(data, grid) {
        grid.innerHTML = "";
        data.recommendations.forEach(m => {
            let confidenceClass = m.confidence === 'bardzo wysoka' ? 'bg-green-600/90' : 
                                 m.confidence === 'wysoka' ? 'bg-blue-600/90' : 'bg-yellow-600/90';
            let confidenceText = m.confidence === 'bardzo wysoka' ? 'BARDZO POLECAM' : 
                                 m.confidence === 'wysoka' ? 'POLECAM' : 'WARTO SPRAWDZIĆ';

            const card = document.createElement('div');
            card.className = 'bg-gray-800 rounded-xl overflow-hidden shadow-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer transform hover:-translate-y-1 group';
            card.onclick = () => window.location.href = `/movie?id=${m.movie_id}`;

            card.innerHTML = `
                <div class="relative aspect-[2/3]">
                    <img src="${m.poster_url || 'https://via.placeholder.com/300x450'}"
                         class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition"
                         alt="${m.title}">
                    
                    <div class="absolute top-2 right-2 bg-gray-900/90 backdrop-blur px-2 py-1 rounded text-xs font-bold text-yellow-400 border border-gray-600">
                        ★ ${m.actual_rating.toFixed(1)}
                    </div>

                    <div class="absolute top-2 left-2 bg-blue-600/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-white border border-blue-400">
                        Dopasowanie: ${m.match_percentage}%
                    </div>

                    <div class="absolute bottom-2 left-2 ${confidenceClass} backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-white border border-white/20">
                        ${confidenceText}
                    </div>
                </div>

                <div class="p-4">
                    <h3 class="font-bold text-white text-sm line-clamp-2 group-hover:text-blue-400 transition mb-2 leading-tight min-h-[2.5rem]">
                        ${m.title}
                    </h3>
                    <p class="text-xs text-gray-400 italic line-clamp-3 leading-relaxed min-h-[3rem]">
                        ${m.explanation}
                    </p>
                    <div class="flex flex-wrap gap-1 mt-3">
                        ${m.genres.slice(0, 3).map(g => `<span class="text-[9px] px-1.5 py-0.5 bg-gray-700 text-gray-300 rounded">${g}</span>`).join('')}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
