<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - System Rekomendacji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #1f2937; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-white mb-6 text-center">Zaloguj się</h1>

        <div id="error-box" class="p-3 mb-4 rounded-lg text-sm text-center bg-red-900 text-red-300 hidden"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-1">Nazwa Użytkownika</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-1">Hasło</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500">
            </div>

            <button type="submit" id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                Zaloguj
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Nie masz konta? 
                <a href="/register" class="text-blue-400 hover:text-blue-300 font-medium">Zarejestruj się</a>
            </p>
        </div>
    </div>

<script>
    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-box');
        const btn = document.getElementById('submit-btn');

        // Reset błędów
        errorBox.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = "Logowanie...";

        try {
            const response = await fetch("http://127.0.0.1:8000/auth/login", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (!response.ok) {
                // Wyświetl błąd (np. Błędne hasło)
                throw new Error(data.detail || "Błąd logowania");
            }

            // SUKCES: Zapisz token i przekieruj do aplikacji
            localStorage.setItem('accessToken', data.access_token);
            // Przekierowanie do strony głównej (home.html)
            window.location.href = "/home";

        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = "Zaloguj";
        }
    }
</script>
</body>
</html>
