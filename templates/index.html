<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieRec - Logowanie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1f2937; min-height: 100vh; }
        .glass-effect { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md glass-effect p-8 rounded-2xl shadow-2xl border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-white mb-2">Movie<span class="text-blue-500">Rec</span></h1>
            <p id="form-title" class="text-gray-400 font-medium text-lg">Zaloguj się do systemu</p>
        </div>

        <div id="message-box" class="p-3 mb-6 rounded-lg text-sm text-center hidden"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="mb-4">
                <label for="username" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nazwa Użytkownika</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-3 bg-gray-900/50 border border-gray-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                       placeholder="Twój login">
            </div>

            <div class="mb-4 hidden" id="email-group">
                <label for="email" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Adres Email</label>
                <input type="email" id="email" name="email"
                       class="w-full px-4 py-3 bg-gray-900/50 border border-gray-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                       placeholder="np. kontakt@movierec.pl">
            </div>

            <div class="mb-8">
                <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Hasło</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-3 bg-gray-900/50 border border-gray-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                       placeholder="••••••••">
            </div>

            <button type="submit" id="submit-button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition duration-300 shadow-lg shadow-blue-900/40 transform active:scale-[0.98]">
                Zaloguj się
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-700 pt-6">
            <p class="text-gray-400 text-sm">
                <span id="toggle-text">Nie masz jeszcze konta?</span>
                <button id="toggle-button" onclick="toggleMode()" class="text-blue-500 hover:text-blue-400 font-bold ml-1 transition">
                    Utwórz konto
                </button>
            </p>
        </div>
    </div>

<script>
    let isLoginMode = true;
    const API_BASE_URL = "http://127.0.0.1:8000";

    const titleEl = document.getElementById('form-title');
    const toggleTextEl = document.getElementById('toggle-text');
    const emailGroupEl = document.getElementById('email-group');
    const emailInputEl = document.getElementById('email');
    const submitButtonEl = document.getElementById('submit-button');
    const toggleButtonEl = document.getElementById('toggle-button');
    const messageBoxEl = document.getElementById('message-box');

    function displayMessage(message, isError = false) {
        messageBoxEl.textContent = message;
        messageBoxEl.classList.remove('hidden', 'bg-red-900/50', 'text-red-200', 'bg-green-900/50', 'text-green-200');
        messageBoxEl.classList.add('block', isError ? 'bg-red-900/50' : 'bg-green-900/50', isError ? 'text-red-200' : 'text-green-200');
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        messageBoxEl.classList.add('hidden');
        titleEl.textContent = isLoginMode ? "Zaloguj się do systemu" : "Stwórz nowe konto";
        submitButtonEl.textContent = isLoginMode ? "Zaloguj się" : "Zarejestruj się";
        toggleTextEl.textContent = isLoginMode ? "Nie masz jeszcze konta?" : "Masz już konto?";
        toggleButtonEl.textContent = isLoginMode ? "Utwórz konto" : "Zaloguj się";
        emailGroupEl.classList.toggle('hidden', isLoginMode);
        if (isLoginMode) emailInputEl.removeAttribute('required');
        else emailInputEl.setAttribute('required', 'required');
    }

    async function handleAuth(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        let url = isLoginMode ? `${API_BASE_URL}/auth/login` : `${API_BASE_URL}/auth/register`;
        let body = isLoginMode ? { username, password } : { username, email: emailInputEl.value, password };

        try {
            submitButtonEl.disabled = true;
            submitButtonEl.innerHTML = '<span class="animate-pulse">Przetwarzanie...</span>';

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                displayMessage(data.detail || "Błąd autoryzacji", true);
                return;
            }

            if (isLoginMode) {
                // Twoja logika (zgodna z auth.py)
                localStorage.setItem('accessToken', data.access_token);
                
                // Tworzymy obiekt usera ręcznie, bo backend zwraca płaskie dane
                const userData = {
                    id: data.user_id,
                    role: data.user_role
                };
                localStorage.setItem('user', JSON.stringify(userData));

                // Przekierowanie
                if (data.user_role === 'admin') {
                    window.location.href = '/admin-panel';
                } else {
                    const params = new URLSearchParams(window.location.search);
                    const nextUrl = params.get('next');
                    window.location.href = nextUrl || '/home';
                }
            } else {
                displayMessage("Konto utworzone! Możesz się teraz zalogować.", false);
                toggleMode();
            }
        } catch (error) {
            console.error(error);
            displayMessage("Błąd połączenia z serwerem API.", true);
        } finally {
            submitButtonEl.disabled = false;
            submitButtonEl.textContent = isLoginMode ? "Zaloguj się" : "Zarejestruj się";
        }
    }

    // BONUS: Strażnik wejścia od dziewczyn (przydatne!)
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('accessToken');
        const userData = localStorage.getItem('user');

        if (token && userData) {
            try {
                const user = JSON.parse(userData);
                window.location.href = (user.role === 'admin') ? '/admin-panel' : '/home';
            } catch (e) {
                // Jeśli dane są uszkodzone, czyścimy
                localStorage.clear();
            }
        }
    });
</script>
</body>
</html>
