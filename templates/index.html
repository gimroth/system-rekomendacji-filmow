<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Rekomendacji Filmów - Logowanie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937; /* Ciemne tło */
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-white mb-6 text-center" id="form-title">Logowanie</h1>

        <div id="message-box" class="p-3 mb-4 rounded-lg text-sm text-center hidden"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">

            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Nazwa Użytkownika</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Wprowadź nazwę">
            </div>

            <div class="mb-4 hidden" id="email-group">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" name="email"
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500 focus:border-blue-500"
                       placeholder="np. jan@domena.pl">
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Hasło</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500 focus:border-blue-500"
                       placeholder="••••••••">
            </div>

            <button type="submit" id="submit-button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Zaloguj
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Nie masz konta?
                <button id="toggle-button" onclick="toggleMode()" class="text-blue-400 hover:text-blue-300 font-medium">
                    Zarejestruj się
                </button>
            </p>
        </div>
    </div>

<script>
    // Zmienne stanu
    let isLoginMode = true;
    const API_BASE_URL = "http://127.0.0.1:8000";

    const titleEl = document.getElementById('form-title');
    const emailGroupEl = document.getElementById('email-group');
    const emailInputEl = document.getElementById('email');
    const submitButtonEl = document.getElementById('submit-button');
    const toggleButtonEl = document.getElementById('toggle-button');
    const messageBoxEl = document.getElementById('message-box');
    const authFormEl = document.getElementById('app');

    // Ustawia komunikat (sukces/błąd)
    function displayMessage(message, isError = false) {
        messageBoxEl.textContent = message;
        messageBoxEl.classList.remove('hidden', 'bg-red-900', 'text-red-300', 'bg-green-900', 'text-green-300');

        if (isError) {
            messageBoxEl.classList.add('bg-red-900', 'text-red-300');
        } else {
            messageBoxEl.classList.add('bg-green-900', 'text-green-300');
        }
    }

    // Przełączanie między logowaniem a rejestracją
    function toggleMode() {
        isLoginMode = !isLoginMode;
        messageBoxEl.classList.add('hidden'); // Ukrywa komunikat

        if (isLoginMode) {
            titleEl.textContent = "Logowanie";
            submitButtonEl.textContent = "Zaloguj";
            toggleButtonEl.textContent = "Zarejestruj się";
            emailGroupEl.classList.add('hidden');
            emailInputEl.removeAttribute('required');
        } else {
            titleEl.textContent = "Rejestracja";
            submitButtonEl.textContent = "Zarejestruj";
            toggleButtonEl.textContent = "Zaloguj się";
            emailGroupEl.classList.remove('hidden');
            emailInputEl.setAttribute('required', 'required');
        }
    }

    // Obsługa logowania/rejestracji
    async function handleAuth(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        let url;
        let body = { username, password };

        if (!isLoginMode) {
            // Rejestracja
            url = `${API_BASE_URL}/auth/register`;
            const email = emailInputEl.value;
            body = { username, email, password };
        } else {
            // Logowanie
            url = `${API_BASE_URL}/auth/login`;
        }

        try {
            submitButtonEl.disabled = true;
            submitButtonEl.textContent = isLoginMode ? "Logowanie..." : "Rejestracja...";

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                // Obsługa błędu zwróconego przez API (np. 401, 400)
                const errorMsg = data.detail || "Wystąpił nieznany błąd podczas autoryzacji.";
                displayMessage(`Błąd: ${errorMsg}`, true);
                return;
            }

            // Sukces
            if (isLoginMode) {
                // 1. Zapisz token
                localStorage.setItem('accessToken', data.access_token);
                localStorage.setItem('refreshToken', data.refresh_token);
                
                // 2. Obsługa przekierowania (REDIRECT)
                const params = new URLSearchParams(window.location.search);
                const nextUrl = params.get('next');

                if (nextUrl) {
                    window.location.href = nextUrl; // Wróć tam skąd przyszedłeś (np. do filmu)
                } else {
                    window.location.href = "/home"; // Idź na stronę główną
                }

            } else {
                // Po rejestracji wróć do logowania z komunikatem sukcesu
                displayMessage(`Użytkownik ${data.username} został pomyślnie zarejestrowany. Zaloguj się.`, false);
                toggleMode(); // Przełącz na Logowanie
            }

        } catch (error) {
            console.error('Błąd sieci lub serwera:', error);
            displayMessage("Błąd połączenia z serwerem API.", true);
        } finally {
            submitButtonEl.disabled = false;
            submitButtonEl.textContent = isLoginMode ? "Zaloguj" : "Zarejestruj";
        }
    }

    // Sprawdzenie przy wejściu, czy użytkownik jest już zalogowany
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('accessToken');
        if (token) {
            // Jeśli jest już zalogowany, sprawdź czy ma gdzie wrócić, jak nie to Home
            const params = new URLSearchParams(window.location.search);
            const nextUrl = params.get('next');
            window.location.href = nextUrl || "/home";
        }
    });
</script>

</body>
</html>
