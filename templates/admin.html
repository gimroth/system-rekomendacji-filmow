<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora 🛡️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1f2937; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-500 mb-4 md:mb-0">Panel Admina 🛡️</h1>

            <div class="flex items-center space-x-4">
                <button onclick="switchTab('movies')" id="btn-movies"
                        class="px-6 py-2 rounded-lg font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-900/50">
                       Zarządzanie Filmami
                </button>
                <button onclick="switchTab('users')" id="btn-users"
                        class="px-6 py-2 rounded-lg font-semibold transition bg-gray-700 text-gray-300 hover:bg-gray-600">
                       Użytkownicy
                </button>
                <button onclick="logout()" class="px-4 py-2 bg-red-900 text-red-200 rounded-lg text-sm hover:bg-red-800 transition">
                    Wyloguj
                </button>
            </div>
        </div>

        <div id="msg" class="hidden"></div>

        <div id="section-movies" class="fade-in">
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 mb-8">
                <h2 class="text-2xl font-bold mb-6 text-green-400 border-b border-gray-700 pb-2">Dodaj Nowy Film (TMDB)</h2>
                <div class="flex flex-col md:flex-row gap-4 mb-4">
                    <input type="text" id="movieQuery" placeholder="Wpisz tytuł filmu..."
                           onkeypress="handleEnter(event)"
                           class="w-full p-4 rounded-lg bg-gray-900 text-white border border-gray-600 focus:outline-none focus:border-green-500">
                    <button onclick="searchMovies()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg font-bold">Szukaj</button>
                </div>
                <div id="searchResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-gray-700 pb-2 gap-4">
                    <h2 class="text-2xl font-bold text-blue-400">Twoja Baza Filmów</h2>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="localSearch" placeholder="Szukaj w bazie..." oninput="loadLocalMovies()"
                               class="p-2 rounded bg-gray-900 border border-gray-600 text-sm w-full text-white">
                        <button onclick="loadLocalMovies()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold text-white">Odśwież</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-700">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Tytuł</th>
                                <th class="p-4">Rok</th>
                                <th class="p-4 text-center">Ocena</th>
                                <th class="p-4 text-center">Głosów</th>
                                <th class="p-4 text-center">Akcje</th>
                            </tr>
                        </thead>
                        <tbody id="localMoviesTable" class="divide-y divide-gray-700 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="section-users" class="hidden fade-in">
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-gray-700 pb-4 gap-4">
                    <h2 class="text-2xl font-bold text-yellow-400">Użytkownicy</h2>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="userSearchQuery" placeholder="Szukaj login lub email..."
                               onkeypress="handleUserEnter(event)"
                               class="p-2 rounded bg-gray-900 border border-gray-600 text-sm w-full md:w-64 focus:outline-none focus:border-yellow-500 text-white">
                        <button onclick="resetUserPageAndLoad()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold text-white transition">
                            Szukaj
                        </button>
                    </div>
                </div>
                <div class="flex justify-end mb-2 text-xs text-gray-400">
                     Znaleziono łącznie: &nbsp;<span id="totalUsersCount" class="text-white font-bold">0</span>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-700 mb-4">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Username</th>
                                <th class="p-4">Email</th>
                                <th class="p-4">Rola</th>
                                <th class="p-4 text-center">Akcje</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center bg-gray-900 p-3 rounded-lg border border-gray-700">
                    <button id="prevBtn" onclick="changePage(-1)" disabled class="px-4 py-2 bg-gray-700 text-gray-300 rounded disabled:opacity-50 hover:bg-gray-600 transition">← Poprzednia</button>
                    <span class="text-gray-400 text-sm">Strona <span id="pageIndicator" class="text-white font-bold">1</span></span>
                    <button id="nextBtn" onclick="changePage(1)" disabled class="px-4 py-2 bg-blue-600 text-white rounded disabled:opacity-50 hover:bg-blue-700 transition">Następna →</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    let currentTab = 'movies';
    let userPage = 1;
    const userLimit = 10;
    let totalUsers = 0;

    document.addEventListener('DOMContentLoaded', () => {
    const userData = localStorage.getItem('user');
    if (!userData) {
        window.location.replace('/login');
        return;
    }

    const user = JSON.parse(userData);
    if (user.role !== 'admin') {
        alert("Brak uprawnień!");
        window.location.replace('/home');
    }
});

    // --- SECURITY GUARD: Sprawdzanie roli przy ładowaniu ---
    document.addEventListener('DOMContentLoaded', () => {
        const userData = localStorage.getItem('user');
        if (!userData) {
            window.location.href = "/login";
            return;
        }
        const user = JSON.parse(userData);
        if (user.role !== 'admin') {
            alert("Brak uprawnień administratora!");
            window.location.href = "/home"; // Przekierowanie użytkownika na stronę główną
            return;
        }
        loadLocalMovies();
    });

    // Helper do nagłówków autoryzacji
    function getAuthHeaders() {
        const token = localStorage.getItem('accessToken');
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/login";
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('section-movies').classList.toggle('hidden', tab !== 'movies');
        document.getElementById('section-users').classList.toggle('hidden', tab !== 'users');

        const btnMovies = document.getElementById('btn-movies');
        const btnUsers = document.getElementById('btn-users');

        if (tab === 'movies') {
            btnMovies.className = "px-6 py-2 rounded-lg font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-900/50";
            btnUsers.className = "px-6 py-2 rounded-lg font-semibold transition bg-gray-700 text-gray-300 hover:bg-gray-600";
            loadLocalMovies();
        } else {
            btnUsers.className = "px-6 py-2 rounded-lg font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-900/50";
            btnMovies.className = "px-6 py-2 rounded-lg font-semibold transition bg-gray-700 text-gray-300 hover:bg-gray-600";
            userPage = 1;
            loadUsers();
        }
    }

    function showMsg(text, isError = false) {
        const msg = document.getElementById("msg");
        msg.innerText = text;
        msg.className = isError
            ? "p-4 rounded-lg bg-red-900/80 text-red-200 border border-red-700 block mb-6 fade-in fixed top-4 right-4 z-50 max-w-sm shadow-xl"
            : "p-4 rounded-lg bg-green-900/80 text-green-200 border border-green-700 block mb-6 fade-in fixed top-4 right-4 z-50 max-w-sm shadow-xl";
        msg.classList.remove("hidden");
        setTimeout(() => msg.classList.add("hidden"), 4000);
    }

    async function searchMovies() {
        const query = document.getElementById("movieQuery").value;
        const container = document.getElementById("searchResults");
        if(!query) return showMsg("Wpisz tytuł!", true);

        container.innerHTML = '<div class="col-span-full text-center text-blue-400 py-4 animate-pulse">Szukam w TMDB...</div>';
        try {
            const res = await fetch(`${API_URL}/admin/movies/search?query=${encodeURIComponent(query)}`, {
                headers: getAuthHeaders()
            });
            if(!res.ok) throw new Error("API Error");
            const movies = await res.json();
            container.innerHTML = "";
            movies.slice(0, 8).forEach(movie => {
                const img = movie.poster_url ? `<img src="${movie.poster_url}" class="w-20 object-cover">` : `<div class="w-20 bg-gray-600 flex items-center justify-center text-xs text-white">Brak</div>`;
                container.innerHTML += `
                    <div class="flex bg-gray-700 rounded-lg overflow-hidden border border-gray-600 h-32">
                        ${img}
                        <div class="p-2 flex flex-col justify-between flex-grow">
                            <div><h3 class="font-bold text-sm text-white line-clamp-2">${movie.title}</h3><span class="text-xs text-gray-400">${movie.year || ""}</span></div>
                            <button onclick="addMovieByTmdb(${movie.tmdb_id}, this)" class="bg-green-600 hover:bg-green-700 text-white text-xs py-1 px-2 rounded mt-1">+ Dodaj</button>
                        </div>
                    </div>`;
            });
        } catch(e) { container.innerHTML = '<div class="col-span-full text-center text-red-400">Błąd wyszukiwania.</div>'; }
    }

    async function addMovieByTmdb(tmdbId, btn) {
        btn.innerText = "⏳"; btn.disabled = true;
        try {
            const res = await fetch(`${API_URL}/admin/movies/tmdb/${tmdbId}`, {
                method: "POST",
                headers: getAuthHeaders()
            });
            if(res.ok) { showMsg("Dodano!"); btn.innerText="✓"; loadLocalMovies(); }
            else { const d = await res.json(); showMsg(d.detail, true); btn.innerText = "+ Dodaj"; btn.disabled = false; }
        } catch(e) { showMsg("Błąd sieci", true); btn.disabled = false; }
    }

    async function loadLocalMovies() {
        const tbody = document.getElementById("localMoviesTable");
        const search = document.getElementById("localSearch").value;
        try {
            let url = `${API_URL}/admin/movies/local?limit=50`;
            if(search) url += `&search=${encodeURIComponent(search)}`;
            const res = await fetch(url, { headers: getAuthHeaders() });
            const movies = await res.json();
            tbody.innerHTML = movies.length ? "" : '<tr><td colspan="6" class="p-4 text-center text-gray-500">Brak filmów.</td></tr>';
            movies.forEach(m => {
                let ratingClass = m.average_rating >= 4.0 ? "text-green-400 font-bold" : (m.average_rating >= 2.5 ? "text-yellow-400" : "text-gray-400");
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-700/50 transition border-b border-gray-700">
                        <td class="p-3 text-gray-500 font-mono text-xs">${m.id}</td>
                        <td class="p-3 font-semibold text-white">${m.title}</td>
                        <td class="p-3 text-gray-400">${m.year || "-"}</td>
                        <td class="p-3 text-center ${ratingClass}">${m.average_rating > 0 ? m.average_rating : "-"}</td>
                        <td class="p-3 text-center text-gray-400 text-xs">${m.ratings_count}</td>
                        <td class="p-3 text-center"><button onclick="deleteMovie(${m.id})" class="text-red-400 hover:text-red-200 text-xs">Usuń</button></td>
                    </tr>`;
            });
        } catch(e) { console.error(e); }
    }

    async function deleteMovie(id) {
        if(!confirm("Usunąć film?")) return;
        try {
            const res = await fetch(`${API_URL}/admin/movies/${id}`, {
                method: "DELETE",
                headers: getAuthHeaders()
            });
            if(res.ok) { showMsg("Usunięto."); loadLocalMovies(); }
        } catch(e) { showMsg("Błąd sieci", true); }
    }

    async function loadUsers() {
        const tbody = document.getElementById("usersTable");
        const skip = (userPage - 1) * userLimit;
        const searchQuery = document.getElementById("userSearchQuery").value;
        try {
            let url = `${API_URL}/admin/users?skip=${skip}&limit=${userLimit}`;
            if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;
            const res = await fetch(url, { headers: getAuthHeaders() });
            const data = await res.json();
            totalUsers = data.total;
            tbody.innerHTML = "";
            document.getElementById("totalUsersCount").innerText = totalUsers;
            document.getElementById("pageIndicator").innerText = userPage;

            data.users.forEach(u => {
                const roleBadge = u.role === 'admin' ? `<span class="px-2 py-1 rounded bg-red-900 text-red-200 text-xs border border-red-700">ADMIN</span>` : `<span class="px-2 py-1 rounded bg-blue-900 text-blue-200 text-xs border border-blue-700">USER</span>`;
                const deleteBtn = u.role !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="text-red-400 hover:text-red-200 text-sm">Usuń</button>` : `<span class="text-gray-600 text-xs italic">Chroniony</span>`;
                tbody.innerHTML += `<tr class="border-b border-gray-700"><td class="p-4 text-sm">${u.id}</td><td class="p-4 font-bold">${u.username}</td><td class="p-4 text-gray-400">${u.email}</td><td class="p-4">${roleBadge}</td><td class="p-4 text-center">${deleteBtn}</td></tr>`;
            });
            document.getElementById("prevBtn").disabled = userPage <= 1;
            document.getElementById("nextBtn").disabled = (userPage * userLimit) >= totalUsers;
        } catch(e) { showMsg("Błąd ładowania użytkowników", true); }
    }

    async function deleteUser(id) {
        if(!confirm("Usunąć użytkownika?")) return;
        try {
            const res = await fetch(`${API_URL}/admin/users/${id}`, {
                method: "DELETE",
                headers: getAuthHeaders()
            });
            if(res.ok) { showMsg("Usunięto."); loadUsers(); }
        } catch(e) { showMsg("Błąd sieci", true); }
    }

    function handleEnter(e) { if(e.key === 'Enter') searchMovies(); }
    function handleUserEnter(e) { if(e.key === 'Enter') resetUserPageAndLoad(); }
    function resetUserPageAndLoad() { userPage = 1; loadUsers(); }
    function changePage(direction) { userPage += direction; loadUsers(); }
</script>
</body>
</html>
