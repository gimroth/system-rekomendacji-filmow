<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora 🛡️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        /* Styl dla aktywnego przycisku w menu panelu */
        .tab-btn-active {
            background-color: #3b82f6 !important;
            color: white !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .movie-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .page-input::-webkit-inner-spin-button, .page-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Panel Admina 🛡️</h1>
            <div class="flex flex-wrap gap-2 mt-4 md:mt-0">
                <button onclick="switchTab('movies')" id="btn-movies" class="px-6 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 transition shadow-sm border border-transparent">Filmy</button>
                <button onclick="switchTab('users')" id="btn-users" class="px-6 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 transition shadow-sm border border-transparent">Użytkownicy</button>
                <button onclick="switchTab('comments')" id="btn-comments" class="px-6 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 transition shadow-sm border border-transparent">Komentarze</button>
                <button onclick="switchTab('ratings')" id="btn-ratings" class="px-6 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 transition shadow-sm border border-transparent">Oceny</button>
                <button onclick="logout()" class="px-6 py-2.5 rounded-xl font-bold bg-red-500/10 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white transition ml-2">Wyloguj</button>
            </div>
        </div>

        <div id="msg" class="hidden p-4 rounded-xl mb-6 text-center font-bold shadow-lg"></div>

        <div id="section-movies" class="space-y-8">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
                <h2 class="text-xl font-bold text-emerald-400 mb-6 flex items-center gap-2"><span>✨</span> Dodaj Nowy Film (TMDB)</h2>
                <div class="flex gap-3 mb-8">
                    <input type="text" id="tmdbQuery" class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="Wyszukaj tytuł w bazie TMDB...">
                    <button onclick="searchTMDB()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-bold transition shadow-lg">Szukaj</button>
                </div>
                <div id="tmdbResults" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6"></div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
                <h2 class="text-xl font-bold text-blue-400 mb-6 font-bold">Twoja Baza Lokalna</h2>
                <input type="text" id="movieSearch" oninput="resetAndLoad('movies')" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-6 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Filtruj filmy po tytule...">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="text-slate-400 border-b border-slate-700 text-sm uppercase tracking-wider">
                            <tr><th class="p-4">Plakat</th><th class="p-4">Tytuł</th><th class="p-4 text-center">Rok</th><th class="p-4 text-center">Ocena</th><th class="p-4 text-right">Akcje</th></tr>
                        </thead>
                        <tbody id="movieTable" class="divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
                <div id="pagination-movies" class="mt-8 flex items-center justify-center gap-4"></div>
            </div>
        </div>

        <div id="section-users" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
             <h2 class="text-xl font-bold text-yellow-400 mb-6">Zarządzanie Użytkownikami</h2>
             <input type="text" id="userSearch" oninput="resetAndLoad('users')" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-6 outline-none" placeholder="Szukaj po nazwie lub emailu...">
             <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-slate-400 border-b border-slate-700 text-sm uppercase">
                        <tr><th class="p-4">Użytkownik</th><th class="p-4">Rola</th><th class="p-4 text-right">Akcje</th></tr>
                    </thead>
                    <tbody id="userTable" class="divide-y divide-slate-700/50"></tbody>
                </table>
             </div>
             <div id="pagination-users" class="mt-8 flex items-center justify-center gap-4"></div>
        </div>

        <div id="section-comments" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
             <h2 class="text-xl font-bold text-purple-400 mb-6 font-bold">Moderacja Komentarzy</h2>
             <input type="text" id="commentSearch" oninput="resetAndLoad('comments')" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-6 outline-none" placeholder="Szukaj w treści lub autorach...">
             <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-slate-400 border-b border-slate-700 text-sm uppercase">
                        <tr><th class="p-4">Film</th><th class="p-4">Autor</th><th class="p-4">Treść</th><th class="p-4 text-right">Akcje</th></tr>
                    </thead>
                    <tbody id="commentTable" class="divide-y divide-slate-700/50"></tbody>
                </table>
             </div>
             <div id="pagination-comments" class="mt-8 flex items-center justify-center gap-4"></div>
        </div>

        <div id="section-ratings" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
             <h2 class="text-xl font-bold text-pink-400 mb-6 font-bold">Logi Ocen</h2>
             <input type="text" id="ratingSearch" oninput="resetAndLoad('ratings')" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-6 outline-none" placeholder="Filtruj oceny...">
             <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-slate-400 border-b border-slate-700 text-sm uppercase">
                        <tr><th class="p-4">Film</th><th class="p-4">Użytkownik</th><th class="p-4 text-center">Ocena</th><th class="p-4 text-right">Akcje</th></tr>
                    </thead>
                    <tbody id="ratingTable" class="divide-y divide-slate-700/50"></tbody>
                </table>
             </div>
             <div id="pagination-ratings" class="mt-8 flex items-center justify-center gap-4"></div>
        </div>
    </div>

    <div id="detailsModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-3xl rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 id="modalTitle" class="text-xl font-bold text-white uppercase tracking-widest"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-3xl transition focus:outline-none">&times;</button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto custom-scroll space-y-8"></div>
        </div>
    </div>

<script>
    const API = "http://127.0.0.1:8000/admin";
    const getHeaders = () => ({ 'Authorization': `Bearer ${localStorage.getItem('accessToken')}`, 'Content-Type': 'application/json' });

    let currentPages = { movies: 1, users: 1, comments: 1, ratings: 1 };
    let totalPages = { movies: 1, users: 1, comments: 1, ratings: 1 };
    const perPage = 10;

    function renderPagination(tab, total) {
        totalPages[tab] = Math.ceil(total / perPage) || 1;
        const container = document.getElementById(`pagination-${tab}`);
        if (!container) return;

        container.innerHTML = `
            <button onclick="changePage('${tab}', ${currentPages[tab] - 1})"
                ${currentPages[tab] === 1 ? 'disabled' : ''}
                class="p-2 rounded-lg bg-slate-700 hover:bg-blue-600 disabled:opacity-30 disabled:hover:bg-slate-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>

            <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-4 py-1.5 rounded-xl">
                <span class="text-slate-400 text-xs font-bold uppercase tracking-tighter">Strona</span>
                <input type="number"
                    id="input-page-${tab}"
                    value="${currentPages[tab]}"
                    min="1" max="${totalPages[tab]}"
                    onchange="handlePageInput(this, '${tab}')"
                    class="page-input w-10 bg-transparent text-center font-extrabold text-blue-400 focus:outline-none text-lg">
                <span class="text-slate-400 text-xs font-bold uppercase tracking-tighter">z ${totalPages[tab]}</span>
            </div>

            <button onclick="changePage('${tab}', ${currentPages[tab] + 1})"
                ${currentPages[tab] === totalPages[tab] ? 'disabled' : ''}
                class="p-2 rounded-lg bg-slate-700 hover:bg-blue-600 disabled:opacity-30 disabled:hover:bg-slate-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        `;
    }

    function handlePageInput(input, tab) {
        let val = parseInt(input.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > totalPages[tab]) val = totalPages[tab];
        changePage(tab, val);
    }

    function changePage(tab, newPage) {
        if (newPage < 1 || newPage > totalPages[tab]) return;
        currentPages[tab] = newPage;
        loadData(tab);
    }

    function resetAndLoad(tab) {
        currentPages[tab] = 1;
        loadData(tab);
    }

    async function loadData(tab) {
        const searchInput = document.getElementById(`${tab === 'movies' ? 'movie' : tab.slice(0,-1)}Search`);
        const search = searchInput ? searchInput.value : "";
        const skip = (currentPages[tab] - 1) * perPage;
        const url = `${API}/${tab === 'movies' ? 'movies/local' : tab}?skip=${skip}&limit=${perPage}&search=${encodeURIComponent(search)}`;

        try {
            const res = await fetch(url, { headers: getHeaders() });
            const data = await res.json();
            if(tab === 'movies') renderMovies(data.movies);
            if(tab === 'users') renderUsers(data.users);
            if(tab === 'comments') renderComments(data.comments);
            if(tab === 'ratings') renderRatings(data.ratings);
            renderPagination(tab, data.total);
        } catch(e) { console.error("Błąd ładowania:", e); }
    }

    // --- RENDERY TABEL (Czcionki powiększone, zdjęcia większe) ---

    function renderMovies(movies) {
        document.getElementById('movieTable').innerHTML = movies.map(m => `
            <tr class="hover:bg-slate-700/20 transition group">
                <td class="p-4"><img src="${m.poster_url || 'https://via.placeholder.com/150x225'}" class="w-16 h-24 object-cover rounded-lg shadow-md border border-slate-600"></td>
                <td class="p-4 text-base font-bold text-white cursor-pointer hover:text-blue-400 transition" onclick="showActivity('movies', ${m.id}, '${m.title.replace(/'/g, "\\'")}')">${m.title}</td>
                <td class="p-4 text-base text-slate-400 text-center">${m.year || '---'}</td>
                <td class="p-4 text-base text-yellow-500 font-bold text-center">★ ${m.average_rating}</td>
                <td class="p-4 text-right"><button onclick="deleteMain('movies', ${m.id})" class="text-red-500 hover:text-red-300 font-bold text-sm uppercase tracking-tighter">USUŃ</button></td>
            </tr>`).join('');
    }

    function renderUsers(users) {
        document.getElementById('userTable').innerHTML = users.map(u => `
            <tr class="hover:bg-slate-700/20 transition group">
                <td class="p-6 text-base font-bold text-white cursor-pointer hover:text-yellow-400 transition" onclick="showActivity('users', ${u.id}, '${u.username}')">
                    ${u.username} <br> <span class="text-xs text-slate-500 font-medium">${u.email}</span>
                </td>
                <td class="p-6"><span class="px-3 py-1 rounded-md text-xs font-bold ${u.role === 'admin' ? 'bg-red-500/20 text-red-400' : 'bg-blue-500/20 text-blue-400'}">${u.role.toUpperCase()}</span></td>
                <td class="p-6 text-right">${u.role !== 'admin' ? `<button onclick="deleteMain('users', ${u.id})" class="text-red-500 font-bold text-sm uppercase">USUŃ</button>` : ''}</td>
            </tr>`).join('');
    }

    function renderComments(comments) {
        document.getElementById('commentTable').innerHTML = comments.map(c => `
            <tr class="hover:bg-slate-700/20 transition group">
                <td class="p-4 flex items-center gap-4">
                    <img src="${c.movie_poster || 'https://via.placeholder.com/150x225'}" class="w-16 h-24 object-cover rounded-lg border border-slate-600">
                    <span class="text-sm font-bold text-slate-400 uppercase truncate w-40">${c.movie_title}</span>
                </td>
                <td class="p-4 text-base font-bold text-blue-400">${c.username}</td>
                <td class="p-4 text-base italic text-slate-300">"${c.content}"</td>
                <td class="p-4 text-right"><button onclick="deleteMain('comments', ${c.id})" class="text-red-500 font-bold text-sm uppercase">USUŃ</button></td>
            </tr>`).join('');
    }

    function renderRatings(ratings) {
        document.getElementById('ratingTable').innerHTML = ratings.map(r => `
            <tr class="hover:bg-slate-700/20 transition group">
                <td class="p-4 flex items-center gap-4">
                    <img src="${r.movie_poster || 'https://via.placeholder.com/150x225'}" class="w-16 h-24 object-cover rounded-lg border border-slate-600">
                    <span class="text-sm font-bold text-slate-400 uppercase truncate w-40">${r.movie_title}</span>
                </td>
                <td class="p-4 text-base font-bold text-pink-400">${r.username}</td>
                <td class="p-4 text-lg text-yellow-500 font-black text-center">★ ${r.rating}</td>
                <td class="p-4 text-right"><button onclick="deleteMain('ratings', ${r.id})" class="text-red-500 font-bold text-sm uppercase">USUŃ</button></td>
            </tr>`).join('');
    }

    // --- MODAL AKTIVITY ---
    async function showActivity(type, id, name) {
        document.getElementById('modalTitle').innerText = name;
        const res = await fetch(`${API}/${type}/${id}/activity`, { headers: getHeaders() });
        const data = await res.json();
        let html = '<div class="space-y-6">';

        html += `<div><h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2">Komentarze</h4><div class="space-y-3">`;
        html += data.comments.map(c => `
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-start">
                <div class="flex gap-4">
                    ${c.poster ? `<img src="${c.poster}" class="w-12 h-16 rounded-lg object-cover">` : ''}
                    <div>
                        <p class="text-sm font-extrabold text-indigo-400 uppercase">${c.user || c.movie}</p>
                        <p class="text-base text-slate-200 mt-1 italic leading-relaxed">"${c.content}"</p>
                    </div>
                </div>
                <button onclick="deleteInModal('comments', ${c.id}, '${type}', ${id}, '${name}')" class="text-red-500 hover:text-red-300 font-bold text-xs">USUŃ</button>
            </div>`).join('') || '<p class="text-slate-600 italic text-sm text-center py-4">Brak komentarzy.</p>';
        html += `</div></div>`;

        html += `<div><h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 mt-8">Oceny</h4><div class="space-y-3">`;
        html += data.ratings.map(r => `
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    ${r.poster ? `<img src="${r.poster}" class="w-12 h-16 rounded-lg object-cover">` : ''}
                    <div>
                        <p class="text-sm font-extrabold text-indigo-400 uppercase">${r.user || r.movie}</p>
                        <p class="text-yellow-500 font-black text-xl">★ ${r.score}</p>
                    </div>
                </div>
                <button onclick="deleteInModal('ratings', ${r.id}, '${type}', ${id}, '${name}')" class="text-red-500 hover:text-red-300 font-bold text-xs">USUŃ</button>
            </div>`).join('') || '<p class="text-slate-600 italic text-sm text-center py-4">Brak ocen.</p>';
        html += `</div></div>`;

        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('detailsModal').classList.remove('hidden');
    }

    // --- OPERACJE ---
    async function searchTMDB() {
        const q = document.getElementById('tmdbQuery').value;
        if(!q) return;

        const res = await fetch(`${API}/movies/search?query=${encodeURIComponent(q)}`, { headers: getHeaders() });
        const data = await res.json();

        document.getElementById('tmdbResults').innerHTML = data.map(m => {
            // Logika przycisku zależna od pola is_added
            const buttonHtml = m.is_added
                ? `<button disabled class="mt-auto bg-slate-700 text-slate-500 border border-slate-600 py-1.5 rounded-lg text-[10px] font-black cursor-not-allowed uppercase">W BAZIE ✓</button>`
                : `<button onclick="addMovie(${m.tmdb_id})" class="mt-auto bg-emerald-600/20 text-emerald-400 border border-emerald-500/50 py-1.5 rounded-lg text-[10px] font-black hover:bg-emerald-600 hover:text-white transition uppercase">DODAJ</button>`;

            const opacityClass = m.is_added ? 'opacity-60' : 'opacity-100';

            return `
                <div class="movie-card bg-slate-900 p-3 rounded-2xl border border-slate-700 text-center flex flex-col shadow-xl ${opacityClass}">
                    <img src="${m.poster_url || 'https://via.placeholder.com/200x300'}" class="w-full h-44 object-cover rounded-xl mb-3 shadow-inner">
                    <p class="text-[11px] font-bold truncate mb-3 text-slate-300 px-1">${m.title}</p>
                    ${buttonHtml}
                </div>`;
        }).join('');
    }

    async function addMovie(id) {
        const res = await fetch(`${API}/movies/tmdb/${id}`, { method: 'POST', headers: getHeaders() });
        if(res.ok) { alert("Film dodany!"); loadData('movies'); }
    }

    async function deleteMain(type, id) {
        if(!confirm("Usunąć trwale?")) return;
        await fetch(`${API}/${type}/${id}`, { method: 'DELETE', headers: getHeaders() });
        loadData(type === 'movies' ? 'movies' : type);
    }

    async function deleteInModal(targetType, targetId, parentType, parentId, parentName) {
        if(!confirm("Usunąć ten wpis?")) return;
        await fetch(`${API}/${targetType}/${targetId}`, { method: 'DELETE', headers: getHeaders() });
        showActivity(parentType, parentId, parentName);
        loadData(parentType === 'movies' ? 'movies' : parentType);
    }

    function switchTab(tab) {
        ['movies', 'users', 'comments', 'ratings'].forEach(t => {
            document.getElementById(`section-${t}`).classList.add('hidden');
            document.getElementById(`btn-${t}`).classList.remove('tab-btn-active');
        });
        document.getElementById(`section-${tab}`).classList.remove('hidden');
        document.getElementById(`btn-${tab}`).classList.add('tab-btn-active');
        resetAndLoad(tab);
    }

    function closeModal() { document.getElementById('detailsModal').classList.add('hidden'); }
    function logout() { localStorage.clear(); window.location.href = "/login"; }

    document.addEventListener('DOMContentLoaded', () => {
        const userData = localStorage.getItem('user');
        if (!userData || JSON.parse(userData).role !== 'admin') {
            window.location.replace('/login');
        } else {
            switchTab('movies');
        }
    });
</script>
</body>
</html>
