<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Top 100 - MovieRec</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1f2937; min-height: 100vh; }

        .rank-1 { color: #fbbf24; border-color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .rank-2 { color: #9ca3af; border-color: #9ca3af; background: rgba(156, 163, 175, 0.1); }
        .rank-3 { color: #b45309; border-color: #b45309; background: rgba(180, 83, 9, 0.1); }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8">

    {% include "navbar.html" %}

    <div class="max-w-4xl mx-auto mb-8">
        <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">🏆 Top 100 Filmów</h1>
                <p class="text-gray-400 text-sm">Najlepiej oceniane filmy wg użytkowników.</p>
            </div>

            <div class="w-full md:w-64">
                <label class="text-xs text-gray-500 font-bold uppercase ml-1">Filtruj wg kategorii</label>
                <select id="genreSelect" onchange="loadRankings()"
                        class="w-full mt-1 px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:ring-blue-500 focus:border-blue-500 cursor-pointer hover:bg-gray-700 transition">
                    <option value="Wszystkie">Wszystkie Gatunki</option>
                </select>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
            <div class="grid grid-cols-12 gap-4 p-4 border-b border-gray-700 text-xs font-bold text-gray-500 uppercase tracking-wider">
                <div class="col-span-2 md:col-span-1 text-center">#</div>
                <div class="col-span-7 md:col-span-9">Film</div>
                <div class="col-span-3 md:col-span-2 text-right">Ocena</div>
            </div>

            <div id="rankingList" class="divide-y divide-gray-700">
                <div class="p-8 text-center text-gray-500 animate-pulse">Ładowanie rankingu...</div>
            </div>
        </div>
    </div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('accessToken');
        const userData = localStorage.getItem('user');
        const onboardingCompleted = localStorage.getItem('onboarding_completed');

        // Check admin
        if (userData) {
            try {
                const user = JSON.parse(userData);
            if (user.role === 'admin') {
                window.location.href = '/admin-panel';
                return;
            }
        } catch (e) {}
        }

        // GUARD: Zalogowany bez preferencji -> onboarding
        if (token && onboardingCompleted !== 'true') {
            alert('Najpierw uzupełnij swoje preferencje filmowe!');
            window.location.href = '/onboarding';
            return;
        }

        // OK - ładuj ranking
        updateAuthUI();
        loadGenres();
        loadRankings();
    });

    function updateAuthUI() {
        const token = localStorage.getItem('accessToken');
        const authSection = document.getElementById('auth-section');
        if (token) {
            authSection.innerHTML = `<button onclick="logout()" class="text-gray-400 hover:text-white text-sm font-semibold transition">Wyloguj</button>`;
        } else {
            authSection.innerHTML = `<a href="/login" class="text-blue-400 hover:text-blue-300 text-sm font-bold">Zaloguj się</a>`;
        }
    }

    function logout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = '/login';
    }

    async function loadGenres() {
        try {
            const res = await fetch(`${API_URL}/movies/genres`);
            const genres = await res.json();
            const select = document.getElementById('genreSelect');
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = g;
                select.appendChild(opt);
            });
        } catch (e) { console.error("Błąd gatunków", e); }
    }

    async function loadRankings() {
        const genre = document.getElementById('genreSelect').value;
        const list = document.getElementById('rankingList');

        list.innerHTML = '<div class="p-8 text-center text-gray-500 animate-pulse">Odświeżanie rankingu...</div>';

        let url = `${API_URL}/movies/?page=1&limit=100&min_count=500`;

        if(genre !== "Wszystkie") url += `&genre=${encodeURIComponent(genre)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            list.innerHTML = "";
            if(data.data.length === 0) {
                list.innerHTML = '<div class="p-8 text-center text-gray-500">Brak filmów spełniających kryteria w tej kategorii.</div>';
                return;
            }

            data.data.forEach((m, index) => {
                const rank = index + 1;
                const poster = m.poster_url || "https://via.placeholder.com/60x90?text=No+Img";

                let rankClass = "text-gray-400 font-mono";
                if (rank === 1) { rankClass = "rank-1 font-bold text-xl border-2 rounded-full w-10 h-10 flex items-center justify-center"; }
                else if (rank === 2) { rankClass = "rank-2 font-bold text-lg border-2 rounded-full w-10 h-10 flex items-center justify-center"; }
                else if (rank === 3) { rankClass = "rank-3 font-bold text-lg border-2 rounded-full w-10 h-10 flex items-center justify-center"; }

                list.innerHTML += `
                    <div onclick="window.location.href='/movie?id=${m.id}'"
                         class="grid grid-cols-12 gap-4 p-4 items-center hover:bg-gray-700/50 transition cursor-pointer group">

                        <div class="col-span-2 md:col-span-1 flex justify-center items-center">
                            <span class="${rankClass}">${rank}</span>
                        </div>

                        <div class="col-span-7 md:col-span-9 flex items-center gap-4">
                            <img src="${poster}" class="w-10 h-14 md:w-12 md:h-16 object-cover rounded shadow-lg group-hover:scale-105 transition">
                            <div>
                                <h3 class="font-bold text-white text-sm md:text-base group-hover:text-blue-400 transition">${m.title}</h3>
                                <span class="text-xs text-gray-500">${m.year || ""} • Głosów: ${m.votes}</span> </div>
                        </div>

                        <div class="col-span-3 md:col-span-2 text-right">
                            <div class="flex items-center justify-end gap-1">
                                <span class="text-yellow-400 text-lg">★</span>
                                <span class="text-white font-bold text-lg">${m.rating}</span>
                            </div>
                            <span class="text-xs text-gray-500 hidden md:block">ocena średnia</span>
                        </div>
                    </div>
                `;
            });

        } catch(e) { console.error(e); list.innerHTML = '<div class="p-4 text-center text-red-400">Błąd ładowania.</div>'; }
    }
</script>
</body>
</html>
