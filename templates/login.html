<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - System Rekomendacji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #1f2937; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-white mb-6 text-center">Zaloguj się</h1>

        <div id="msg-box" class="hidden p-3 mb-4 rounded-lg text-sm text-center"></div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-1">Nazwa Użytkownika</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-1">Hasło</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
            </div>

            <button type="submit" id="btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                Zaloguj się
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Nie masz konta? 
                <a href="/register" class="text-green-400 hover:text-green-300 font-medium">Zarejestruj się</a>
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg-box');
            
            btn.disabled = true;
            btn.textContent = "Logowanie...";
            msg.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                // WAŻNE: Tu jest poprawny adres do Twojego backendu
                const res = await fetch("/auth/token", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) throw new Error("Błędny login lub hasło");

                // Zapisujemy ciasteczko
                document.cookie = `access_token=Bearer ${data.access_token}; path=/; max-age=3600; SameSite=Lax`;
                
                // Przekierowanie
                window.location.href = "/";

            } catch (err) {
                msg.textContent = err.message;
                msg.className = "p-3 mb-4 rounded-lg text-sm text-center bg-red-900 text-red-300 block";
                btn.disabled = false;
                btn.textContent = "Zaloguj się";
            }
        }
    </script>
</body>
</html>
